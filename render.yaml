services:
  - type: web
    name: andin-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/andin/index.js
    # Data kebun disimpan di project Firebase kedua (gratis) supaya
    # tetap persisten tanpa volume berbayar. Isi dua variable
    # ANDIN_FIRESTORE_* dengan service account dari project kedua.
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANDIN_ORIGINS
        sync: false
      - key: ANDIN_FIREBASE_PROJECT_ID
        sync: false
      - key: ANDIN_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANDIN_STORAGE
        value: firestore
      - key: ANDIN_FIRESTORE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANDIN_FIRESTORE_PROJECT_ID
        sync: false
